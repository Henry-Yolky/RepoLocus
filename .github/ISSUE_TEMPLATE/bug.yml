name: Bug report
description: Report a reproducible RepoLocus failure.
title: "[Bug]: "
labels: ["type:bug", "status:needs-triage"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include the exact command and sanitized output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RepoLocus version
      placeholder: repolocus --version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Python
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials and private source from this report.
          required: true
