name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          enable-cache: true
          version: "0.9.18"
      - name: Verify tag, version, and main first-parent history
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(uv version --short)"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $tag" >&2
            exit 1
          fi
          if [[ "$tag" != "v$version" ]]; then
            echo "Tag $tag does not match project version $version" >&2
            exit 1
          fi
          git fetch --no-tags origin refs/heads/main
          release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git rev-list --first-parent FETCH_HEAD | grep -Fx "$release_commit" >/dev/null; then
            echo "Tag $tag must point to a commit on main's first-parent history" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Test release source
        env:
          PROJECT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv sync --all-extras --locked
          runtime_version="$(uv run python -c 'import repolocus; print(repolocus.__version__)')"
          test "$runtime_version" = "$PROJECT_VERSION"
          uv run ruff format --check .
          uv run ruff check .
          uv run pytest
          uv run repolocus doctor --security --json
      - name: Run fixed multi-repository retrieval release gate
        env:
          PROJECT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release-assets
          uv run python scripts/evaluate_external_repositories.py evaluation \
            --minimum-hit-rate 0.90 \
            --minimum-macro-recall 0.80 \
            --minimum-mrr 0.75 \
            --minimum-citation-recall 1.0 \
            --minimum-no-answer-f1 0.80 \
            --maximum-must-not-return-rate 0.0 \
            --minimum-qrels 100 \
            --minimum-answerable-qrels 60 \
            --minimum-no-answer-qrels 20 \
            --minimum-citation-qrels 60 \
            --output "release-assets/repolocus-${PROJECT_VERSION}.external-evaluation.json"
      - name: Run the versioned 100k-file release performance gate
        env:
          PROJECT_VERSION: ${{ steps.version.outputs.version }}
        run: >-
          uv run python benchmarks/benchmark_v020.py
          --manifest benchmarks/v0.2-scale-gates.json
          --output
          "release-assets/repolocus-${PROJECT_VERSION}.scale-benchmark.json"
      - name: Build and check Python distributions
        run: |
          mkdir -p release-assets
          uv build --out-dir release-assets
          uvx twine==6.2.0 check release-assets/*.whl release-assets/*.tar.gz
      - name: Package Codex Skill
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          git archive --format=zip
          --prefix=repolocus-analyze-repo/
          --output="release-assets/repolocus-analyze-repo-${VERSION}.zip"
          HEAD:skills/repolocus-analyze-repo
      - name: Export CycloneDX SBOM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          uv export --frozen --no-dev --extra api --extra treesitter
          --preview-features sbom-export
          --format cyclonedx1.5
          --output-file "release-assets/repolocus-${VERSION}.cyclonedx.json"
      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          LC_ALL=C sha256sum * > SHA256SUMS
      - name: Attest every release asset
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  verify-provenance:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.14"
          enable-cache: false
          version: "0.9.18"
      - name: Verify checksums and GitHub attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          sha256sum -c SHA256SUMS
          for asset in *; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
          done
      - name: Install the core wheel and smoke-test the heuristic fallback
        env:
          PROJECT_VERSION: ${{ needs.build.outputs.version }}
        run: |
          uv venv --python 3.14 /tmp/repolocus-release-core
          wheel="$(find release-assets -maxdepth 1 -name 'repolocus-*.whl' -print -quit)"
          test -n "$wheel"
          uv pip install --python /tmp/repolocus-release-core/bin/python "${wheel}"
          runtime_version="$(/tmp/repolocus-release-core/bin/repolocus --version)"
          test "$runtime_version" = "RepoLocus $PROJECT_VERSION"
          /tmp/repolocus-release-core/bin/python - <<'PY'
          from repolocus.parsers import TreeSitterParser, parse_source

          assert TreeSitterParser.discover() is None
          result = parse_source(
              "fixture.c",
              "int add(int left, int right) { return left + right; }\n",
              "c",
          )
          assert any(symbol.name == "add" for symbol in result.symbols)
          assert result.chunks
          PY
      - name: Install runtime extras and smoke-test every Tree-sitter language
        run: |
          uv venv --python 3.14 /tmp/repolocus-release-treesitter
          wheel="$(find release-assets -maxdepth 1 -name 'repolocus-*.whl' -print -quit)"
          test -n "$wheel"
          uv pip install --python /tmp/repolocus-release-treesitter/bin/python "${wheel}[api,treesitter]"
          /tmp/repolocus-release-treesitter/bin/python - <<'PY'
          from repolocus.parsers import SourceLayout, TreeSitterParser

          parser = TreeSitterParser.discover()
          assert parser is not None
          expected_languages = {"c", "cpp", "javascript", "typescript", "rust"}
          assert parser.languages == expected_languages
          fixtures = (
              ("c", "fixture.c", "int add(int a, int b) { return a + b; }\n", "add"),
              ("cpp", "fixture.cpp", "int add(int a, int b) { return a + b; }\n", "add"),
              ("javascript", "fixture.js", "function run() { return 1; }\n", "run"),
              ("typescript", "fixture.ts", "function run(): number { return 1; }\n", "run"),
              ("typescript", "fixture.tsx", "const View = () => <main>ok</main>;\n", "View"),
              ("rust", "fixture.rs", "fn run() -> i32 { 1 }\n", "run"),
          )
          for language, path, source, expected_symbol in fixtures:
              source_bytes = source.encode("utf-8")
              root = parser._parser(language, path=path).parse(source_bytes).root_node
              assert root.has_error is False
              native_symbols = parser._symbols(
                  path,
                  source_bytes,
                  root,
                  SourceLayout.build(source, language=language),
              )
              assert any(symbol.name == expected_symbol for symbol in native_symbols)
              result = parser.parse(
                  path,
                  source,
                  language,
                  max_chunk_lines=160,
                  max_chunk_chars=16_000,
              )
              assert any(symbol.name == expected_symbol for symbol in result.symbols)
              assert result.chunks
          PY
          /tmp/repolocus-release-treesitter/bin/repolocus doctor --security --json

  publish-pypi:
    needs: [build, verify-provenance]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/repolocus
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets
      - name: Select Python distributions
        run: |
          mkdir -p dist
          cp release-assets/*.whl release-assets/*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  publish-github-release:
    needs: [build, verify-provenance, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets
      - name: Create GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-assets/*
          --verify-tag
          --generate-notes
          --title "RepoLocus $GITHUB_REF_NAME"
