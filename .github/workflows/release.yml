name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          enable-cache: true
          version: "0.9.18"
      - name: Verify tag, version, and main first-parent history
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(uv version --short)"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $tag" >&2
            exit 1
          fi
          if [[ "$tag" != "v$version" ]]; then
            echo "Tag $tag does not match project version $version" >&2
            exit 1
          fi
          git fetch --no-tags origin refs/heads/main
          release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git rev-list --first-parent FETCH_HEAD | grep -Fx "$release_commit" >/dev/null; then
            echo "Tag $tag must point to a commit on main's first-parent history" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Test release source
        env:
          PROJECT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv sync --all-extras --locked
          runtime_version="$(uv run python -c 'import repolocus; print(repolocus.__version__)')"
          test "$runtime_version" = "$PROJECT_VERSION"
          uv run ruff format --check .
          uv run ruff check .
          uv run pytest
          uv run repolocus doctor --security --json
      - name: Run fixed multi-repository retrieval release gate
        env:
          PROJECT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release-assets
          uv run python scripts/evaluate_external_repositories.py evaluation \
            --minimum-hit-rate 0.90 \
            --minimum-macro-recall 0.80 \
            --minimum-mrr 0.75 \
            --minimum-citation-recall 1.0 \
            --minimum-no-answer-f1 0.80 \
            --maximum-must-not-return-rate 0.0 \
            --output "release-assets/repolocus-${PROJECT_VERSION}.external-evaluation.json"
      - name: Build and check Python distributions
        run: |
          mkdir -p release-assets
          uv build --out-dir release-assets
          uvx twine==6.2.0 check release-assets/*.whl release-assets/*.tar.gz
      - name: Package Codex Skill
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          git archive --format=zip
          --prefix=repolocus-analyze-repo/
          --output="release-assets/repolocus-analyze-repo-${VERSION}.zip"
          HEAD:skills/repolocus-analyze-repo
      - name: Export CycloneDX SBOM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          uv export --frozen --no-dev --extra api --preview-features sbom-export
          --format cyclonedx1.5
          --output-file "release-assets/repolocus-${VERSION}.cyclonedx.json"
      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          LC_ALL=C sha256sum * > SHA256SUMS
      - name: Attest every release asset
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  verify-provenance:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.14"
          enable-cache: false
          version: "0.9.18"
      - name: Verify checksums and GitHub attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          sha256sum -c SHA256SUMS
          for asset in *; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
          done
      - name: Install the wheel and run the security doctor in a clean environment
        env:
          PROJECT_VERSION: ${{ needs.build.outputs.version }}
        run: |
          uv venv --python 3.14 /tmp/repolocus-release-verify
          wheel="$(find release-assets -maxdepth 1 -name 'repolocus-*.whl' -print -quit)"
          test -n "$wheel"
          uv pip install --python /tmp/repolocus-release-verify/bin/python "${wheel}[api]"
          runtime_version="$(/tmp/repolocus-release-verify/bin/repolocus --version)"
          test "$runtime_version" = "RepoLocus $PROJECT_VERSION"
          /tmp/repolocus-release-verify/bin/repolocus doctor --security --json

  publish-pypi:
    needs: [build, verify-provenance]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/repolocus
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets
      - name: Select Python distributions
        run: |
          mkdir -p dist
          cp release-assets/*.whl release-assets/*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  publish-github-release:
    needs: [build, verify-provenance, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets
      - name: Create GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-assets/*
          --verify-tag
          --generate-notes
          --title "RepoLocus $GITHUB_REF_NAME"
