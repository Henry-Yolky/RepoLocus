name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          version: "0.9.18"
      - run: uv sync --all-extras --locked
      - run: uv run pytest

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.10"
          enable-cache: true
          version: "0.9.18"
      - run: uv sync --all-extras --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest --cov=repolocus --cov-report=term-missing

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          version: "0.9.18"
      - run: uv sync --all-extras --locked
      - run: uv run repolocus doctor --security --json
      - name: Scan Python for medium/high-severity security issues
        run: >-
          uvx bandit==1.9.4 -q -ll -r
          src
          skills/repolocus-analyze-repo/scripts
      - name: Export runtime SBOM, including API dependencies
        run: >-
          uv export --frozen --no-dev --extra api --preview-features sbom-export
          --format cyclonedx1.5 --output-file sbom.json
      - name: Export auditable requirements
        run: >-
          uv export --frozen --no-dev --extra api --no-hashes
          --output-file requirements-audit.txt
      - name: Audit known dependency vulnerabilities
        run: uvx pip-audit==2.10.1 -r requirements-audit.txt
      - name: Record and check dependency licenses
        run: |
          uv run --with pip-licenses==5.5.5 pip-licenses \
            --from=mixed --format=json --output-file=licenses.json
          uv run python scripts/check_licenses.py licenses.json
      - name: Upload supply-chain reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supply-chain-reports
          path: |
            sbom.json
            licenses.json
            requirements-audit.txt
          if-no-files-found: warn

  external-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          enable-cache: true
          version: "0.9.18"
      - run: uv sync --all-extras --locked
      - name: Run fixed multi-repository retrieval gate
        run: >-
          uv run python scripts/evaluate_external_repositories.py evaluation
          --minimum-hit-rate 0.90
          --minimum-macro-recall 0.80
          --minimum-mrr 0.75
          --minimum-citation-recall 1.0
          --minimum-no-answer-f1 0.80
          --maximum-must-not-return-rate 0.0
          --output external-evaluation.json
      - name: Upload external evaluation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: external-evaluation
          path: external-evaluation.json
          if-no-files-found: error

  package:
    needs: [test, coverage, security, external-evaluation]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI gate to succeed
        env:
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          EVALUATION_RESULT: ${{ needs.external-evaluation.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          for result in "$TEST_RESULT" "$COVERAGE_RESULT" "$SECURITY_RESULT" "$EVALUATION_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "Required CI gate did not succeed: $result" >&2
              exit 1
            fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          version: "0.9.18"
      - run: uv build
      - name: Install wheel in a clean environment
        run: |
          uv venv /tmp/repolocus-wheel-test
          wheel="$(find dist -maxdepth 1 -name 'repolocus-*.whl' -print -quit)"
          test -n "$wheel"
          uv pip install --python /tmp/repolocus-wheel-test/bin/python "${wheel}[api]"
          /tmp/repolocus-wheel-test/bin/repolocus --version
      - name: Build container image
        run: docker build --tag repolocus:ci .
