name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          version: "0.9.18"
      - run: uv sync --all-extras --locked
      - run: uv run pytest

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.10"
          enable-cache: true
          version: "0.9.18"
      - run: uv sync --all-extras --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest --cov=repolocus --cov-report=term-missing

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          version: "0.9.18"
      - run: uv sync --all-extras --locked
      - run: uv run repolocus doctor --security --json
      - name: Scan Python for medium/high-severity security issues
        run: >-
          uvx bandit==1.9.4 -q -ll -r
          src
          skills/repolocus-analyze-repo/scripts
      - name: Export runtime SBOM, including optional runtime dependencies
        run: >-
          uv export --frozen --no-dev --extra api --extra treesitter
          --preview-features sbom-export
          --format cyclonedx1.5 --output-file sbom.json
      - name: Export auditable requirements
        run: >-
          uv export --frozen --no-dev --extra api --extra treesitter --no-hashes
          --output-file requirements-audit.txt
      - name: Audit known dependency vulnerabilities
        run: uvx pip-audit==2.10.1 -r requirements-audit.txt
      - name: Record and check dependency licenses
        run: |
          uv run --with pip-licenses==5.5.5 pip-licenses \
            --from=mixed --format=json --output-file=licenses.json
          uv run python scripts/check_licenses.py licenses.json
      - name: Upload supply-chain reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supply-chain-reports
          path: |
            sbom.json
            licenses.json
            requirements-audit.txt
          if-no-files-found: warn

  external-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          enable-cache: true
          version: "0.9.18"
      - run: uv sync --all-extras --locked
      - name: Run fixed multi-repository retrieval gate
        run: >-
          uv run python scripts/evaluate_external_repositories.py evaluation
          --minimum-hit-rate 0.90
          --minimum-macro-recall 0.80
          --minimum-mrr 0.75
          --minimum-citation-recall 1.0
          --minimum-no-answer-f1 0.80
          --maximum-must-not-return-rate 0.0
          --minimum-qrels 100
          --minimum-answerable-qrels 60
          --minimum-no-answer-qrels 20
          --minimum-citation-qrels 60
          --output external-evaluation.json
      - name: Upload external evaluation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: external-evaluation
          path: external-evaluation.json
          if-no-files-found: error

  performance-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          enable-cache: true
          version: "0.9.18"
      - run: uv sync --all-extras --locked
      - name: Run the versioned v0.2 hosted-runner performance gate
        run: >-
          uv run python benchmarks/benchmark_v020.py
          --manifest benchmarks/v0.2-gates.json
          --output v0.2-benchmark.json
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v0.2-benchmark
          path: v0.2-benchmark.json
          if-no-files-found: error

  package:
    needs: [test, coverage, security, external-evaluation, performance-benchmark]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI gate to succeed
        env:
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          EVALUATION_RESULT: ${{ needs.external-evaluation.result }}
          PERFORMANCE_RESULT: ${{ needs.performance-benchmark.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          for result in \
            "$TEST_RESULT" "$COVERAGE_RESULT" "$SECURITY_RESULT" \
            "$EVALUATION_RESULT" "$PERFORMANCE_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "Required CI gate did not succeed: $result" >&2
              exit 1
            fi
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
          version: "0.9.18"
      - run: uv build
      - name: Install core wheel and smoke-test the heuristic fallback
        run: |
          uv venv --python 3.12 /tmp/repolocus-wheel-core
          wheel="$(find dist -maxdepth 1 -name 'repolocus-*.whl' -print -quit)"
          test -n "$wheel"
          uv pip install --python /tmp/repolocus-wheel-core/bin/python "${wheel}"
          /tmp/repolocus-wheel-core/bin/repolocus --version
          /tmp/repolocus-wheel-core/bin/python - <<'PY'
          from repolocus.parsers import TreeSitterParser, parse_source

          assert TreeSitterParser.discover() is None
          result = parse_source(
              "fixture.c",
              "int add(int left, int right) { return left + right; }\n",
              "c",
          )
          assert any(symbol.name == "add" for symbol in result.symbols)
          assert result.chunks
          PY
      - name: Install wheel extras and smoke-test every Tree-sitter language
        run: |
          uv venv --python 3.12 /tmp/repolocus-wheel-treesitter
          wheel="$(find dist -maxdepth 1 -name 'repolocus-*.whl' -print -quit)"
          test -n "$wheel"
          uv pip install --python /tmp/repolocus-wheel-treesitter/bin/python "${wheel}[api,treesitter]"
          /tmp/repolocus-wheel-treesitter/bin/python - <<'PY'
          from repolocus.parsers import SourceLayout, TreeSitterParser

          parser = TreeSitterParser.discover()
          assert parser is not None
          expected_languages = {"c", "cpp", "javascript", "typescript", "rust"}
          assert parser.languages == expected_languages
          fixtures = (
              ("c", "fixture.c", "int add(int a, int b) { return a + b; }\n", "add"),
              ("cpp", "fixture.cpp", "int add(int a, int b) { return a + b; }\n", "add"),
              ("javascript", "fixture.js", "function run() { return 1; }\n", "run"),
              ("typescript", "fixture.ts", "function run(): number { return 1; }\n", "run"),
              ("typescript", "fixture.tsx", "const View = () => <main>ok</main>;\n", "View"),
              ("rust", "fixture.rs", "fn run() -> i32 { 1 }\n", "run"),
          )
          for language, path, source, expected_symbol in fixtures:
              source_bytes = source.encode("utf-8")
              root = parser._parser(language, path=path).parse(source_bytes).root_node
              assert root.has_error is False
              native_symbols = parser._symbols(
                  path,
                  source_bytes,
                  root,
                  SourceLayout.build(source, language=language),
              )
              assert any(symbol.name == expected_symbol for symbol in native_symbols)
              result = parser.parse(
                  path,
                  source,
                  language,
                  max_chunk_lines=160,
                  max_chunk_chars=16_000,
              )
              assert any(symbol.name == expected_symbol for symbol in result.symbols)
              assert result.chunks
          PY
      - name: Build container image
        run: docker build --tag repolocus:ci .
