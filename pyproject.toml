[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "repolocus"
version = "0.1.5"
description = "A read-only, local-first codebase map with source-backed answers."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES"]
authors = [{ name = "RepoLocus contributors" }]
keywords = ["codebase", "architecture", "mermaid", "rag", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "httpx>=0.27,<1",
  "pathspec>=0.12,<1",
  "platformdirs>=4.2,<5",
  "rich>=13.7,<15",
  "tomli>=2,<3; python_version < '3.11'",
  "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/Henry-Yolky/RepoLocus"
Repository = "https://github.com/Henry-Yolky/RepoLocus"
Issues = "https://github.com/Henry-Yolky/RepoLocus/issues"
Changelog = "https://github.com/Henry-Yolky/RepoLocus/blob/main/CHANGELOG.md"

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = [
  "coverage[toml]>=7.6,<8",
  "httpx>=0.27,<1",
  "hypothesis>=6.112,<7",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
repolocus = "repolocus.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/repolocus"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["repolocus"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
extend-exclude = ["evaluation/repos"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
